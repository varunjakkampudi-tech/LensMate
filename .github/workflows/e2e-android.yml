# Maestro end-to-end flows on an Android emulator. Manual trigger only (workflow_dispatch). It never runs on push,
# pull request or schedule.
#
# OWNER DECISION REQUIRED BEFORE ENABLING (BLOCKER-009): each run uses GitHub Actions runner minutes on an
# ubuntu-24.04 runner with KVM and an Android emulator, which is much slower than the existing CI jobs. The owner
# must confirm the minutes allowance for this account before any run is started.
#
# Owner-gated debug build: the first step fails on purpose. apps/mobile has no android/ directory and no debug
# build has been verified in CI. The owner must approve a debug build path that needs no EAS account and no
# signing secrets, then replace that step. No secrets are referenced anywhere in this workflow.
#
# Pinned versions, checked on 2026-10-24 through the GitHub API (both are at least two weeks old):
# - reactivecircus/android-emulator-runner v2.38.0, published 2026-07-05, tag commit a421e43855164a8197daf9d8d40fe71c6996bb0d.
# - mobile-dev-inc/maestro cli-2.11.0, published 2026-09-29. maestro.zip sha256 is taken from the release's
#   checksums_sha256.txt, and the install step verifies it.
# actions/checkout uses the same pin as ci.yml.

name: E2E Android (manual)

on:
  workflow_dispatch:
    inputs:
      api_levels:
        description: "JSON array of Android API levels for the emulator matrix. Default is one level, 34."
        required: true
        default: "[34]"
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.api_levels) }}
    steps:
      - name: Owner-gated debug build (not configured)
        run: |
          echo "::error::The debug Android build step is owner-gated (BLOCKER-009 and the build decision). Approve a debug build path that needs no EAS account and no secrets, then replace this step."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI (pinned, checksum verified)
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro"
          curl -fsSL -o "$RUNNER_TEMP/maestro/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro/maestro.zip" | sha256sum --check --strict -
          unzip -q "$RUNNER_TEMP/maestro/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on the Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/lensmate-debug.apk"
            maestro test e2e/maestro
