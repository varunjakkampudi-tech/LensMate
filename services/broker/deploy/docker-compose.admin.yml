# Used only by the owner for enrolment codes and device revocation. It gives the one-off admin CLI the admin role's
# connection string. The normal broker containers never receive it, and the broker itself cannot issue codes.
#   docker compose -p lensmate-broker -f docker-compose.yml -f docker-compose.admin.yml run --rm broker node dist/admin-cli.js enrol-code
name: lensmate-broker

services:
  broker:
    environment:
      BROKER_ADMIN_DATABASE_URL_FILE: /run/secrets/broker_admin_database_url
      # Revoke records the revocation on the anchor volume, so a restore cannot bring the device back unnoticed.
      BROKER_LEDGER_ANCHOR_FILE: /var/lib/broker-anchor/ledger-anchor.json
    volumes:
      - broker_anchor:/var/lib/broker-anchor
    # !override replaces the base service list, so this container gets only the admin URL.
    secrets: !override [broker_admin_database_url]

secrets:
  broker_admin_database_url:
    file: ./secrets/broker_admin_database_url
