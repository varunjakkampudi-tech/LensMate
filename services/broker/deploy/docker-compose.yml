# Broker stack for the single Hostinger VPS (BLOCKER-006). Not deployed by the agent; owner approval is required.
# Isolation: its own project name, its own networks and volume, no published database port, and no shared
# containers with other Viswatra products. Secrets come from files under ./secrets (not committed).
name: lensmate-broker

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  broker:
    <<: *hardening
    build:
      context: ../../..
      dockerfile: services/broker/deploy/Dockerfile
    image: lensmate-broker:local
    user: "node"
    tmpfs: ["/tmp"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    environment:
      BROKER_MODE: ${BROKER_MODE:-mock}
      BROKER_HOST: 0.0.0.0
      BROKER_PORT: "8080"
      BROKER_MONTHLY_CAP_PAISE: ${BROKER_MONTHLY_CAP_PAISE:?set the owner-confirmed cap in paise}
      BROKER_OWNER_CAP_CONFIRMATION_PAISE: ${BROKER_OWNER_CAP_CONFIRMATION_PAISE:-}
      # Paid calls stay off unless the owner sets on. The live-test budget (dev-test bucket) is passed through, so the
      # USD 0.50 limit is enforced in the container and not only in the env file.
      BROKER_PAID_CALLS: ${BROKER_PAID_CALLS:-off}
      BROKER_DEV_TEST_CAP_PAISE: ${BROKER_DEV_TEST_CAP_PAISE:-}
      BROKER_FX_PAISE_PER_USD: ${BROKER_FX_PAISE_PER_USD:?set the owner exchange-rate setting}
      BROKER_DATABASE_URL_FILE: /run/secrets/broker_app_database_url
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # Spend-continuity anchor on its own volume. A database restore never touches it (see ledger-anchor.ts).
      BROKER_LEDGER_ANCHOR_FILE: /var/lib/broker-anchor/ledger-anchor.json
      # Set to yes only for the owner's first start of an empty ledger; unset otherwise (see README).
      BROKER_LEDGER_GENESIS: ${BROKER_LEDGER_GENESIS:-}
      # One reverse proxy hop in front, so the enrolment rate limit sees the real client address.
      BROKER_TRUST_PROXY_HOPS: "1"
    volumes:
      - broker_anchor:/var/lib/broker-anchor
    secrets: [broker_app_database_url, openrouter_api_key]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [egress, db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: broker
      POSTGRES_USER: broker_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password, broker_app_password, broker_admin_password]
    volumes:
      - broker_pgdata:/var/lib/postgresql/data
      # One-time role creation on first start (see db/01-create-app-role.sh). Read-only.
      - ./db/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    tmpfs: ["/run/postgresql", "/tmp"]
    # The official entrypoint needs these to set up its data directory. Nothing else is granted.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 512m
    cpus: 0.5
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker_owner -d broker"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  egress: {}
  db:
    internal: true

secrets:
  broker_app_database_url:
    file: ./secrets/broker_app_database_url
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  broker_app_password:
    file: ./secrets/broker_app_password
  broker_admin_password:
    file: ./secrets/broker_admin_password
  postgres_owner_password:
    file: ./secrets/postgres_owner_password

volumes:
  broker_pgdata: {}
  # Never included in a database backup or restore. Holds the spend anchor.
  broker_anchor: {}
