# Flow B: home screen, open the measurement screen, go back to home.
# Texts are copied from apps/mobile/src/strings.ts (measurement section) and the home screen.
appId: com.viswatra.lensmate
---
- launchApp:
    clearState: true
- tapOn: "Open measurement screen"
- assertVisible: "Measurement"
- assertVisible: "Session"
- scrollUntilVisible:
    element:
      text: "Back to home"
    direction: DOWN
- tapOn: "Back to home"
- assertVisible: "Connect virtual glasses"
