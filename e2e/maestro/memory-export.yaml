# Flow: the memory export button exists (testID memory-export-button).
# Authored Maestro flow. Run against the matching local Android development build.
# Run: maestro test e2e/maestro/memory-export.yaml
appId: com.viswatra.lensmate
---
- launchApp:
    clearState: true
- tapOn: "Notes"
- assertVisible: "Notes"
- scrollUntilVisible:
    element:
      id: "memory-export-button"
    direction: DOWN
- assertVisible:
    id: "memory-export-button"
