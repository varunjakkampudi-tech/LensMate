# Flow: Capture — the "Last photo" and "Translate the text" chips exist.
# Evidence: NOT RUN (BLOCKER-009: emulator and simulator jobs are blocked).
# Run: maestro test e2e/maestro/capture-last-photo-and-translate.yaml
appId: com.viswatra.lensmate
---
- launchApp:
    clearState: true
- tapOn: "See"
- assertVisible: "Last photo"
- assertVisible:
    id: "last-photo-button"
- scrollUntilVisible:
    element:
      id: "quick-translate"
    direction: DOWN
- assertVisible:
    id: "quick-translate"
- assertVisible: "Translate the text"
