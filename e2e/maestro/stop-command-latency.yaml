# Flow: Stop command — start speaking on Assistant and check the Diagnostics "Last stop" row (testID stop-latency) exists.
# Evidence: NOT RUN (BLOCKER-009: emulator and simulator jobs are blocked).
# Run: maestro test e2e/maestro/stop-command-latency.yaml
appId: com.viswatra.lensmate
---
- launchApp:
    clearState: true
- tapOn: "Hear & Talk"
- assertVisible: "Assistant"
- tapOn: "What can you do?"
- assertVisible:
    id: "talk-interrupt-button"
- tapOn:
    id: "talk-interrupt-button"
- tapOn:
    id: "nav-profile"
- assertVisible: "Profile & settings"
- scrollUntilVisible:
    element:
      id: "profile-section-diagnostics"
    direction: DOWN
- tapOn:
    id: "profile-section-diagnostics"
- scrollUntilVisible:
    element:
      id: "open-diagnostics-button"
    direction: DOWN
- tapOn:
    id: "open-diagnostics-button"
- assertVisible: "Diagnostics"
- assertVisible:
    id: "stop-latency"
