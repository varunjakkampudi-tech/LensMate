# Flow C: first-run setup reaches the Assistant screen.
# Evidence: NOT RUN (BLOCKER-009: emulator and simulator jobs are blocked).
# Run: maestro test e2e/maestro/onboarding-to-assistant.yaml
appId: com.viswatra.lensmate
---
- launchApp:
    clearState: true
- assertVisible: "Hello!"
- assertVisible: "Set up AI on this phone"
- tapOn: "I understand and accept"
- assertVisible: "Cloud notice accepted."
- tapOn: "Hear & Talk"
- assertVisible: "Assistant"
- assertVisible: "Ask anything, by voice or text."
- assertVisible: "Answers: mock, no provider called"
